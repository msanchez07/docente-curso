appId: es.manuelsanchez.aulanova
productName: Aula Nova
copyright: © 2026 Manuel Sánchez Gomis
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/plantillas
    to: resources/plantillas
  - from: resources/boe
    to: resources/boe
  - from: resources/horarios
    to: resources/horarios
  - from: resources/mapa
    to: resources/mapa
  - from: resources/normativa-fp
    to: resources/normativa-fp
win:
  executableName: aula-nova
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: AulaNova-${version}-win-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
dmg:
  artifactName: AulaNova-${version}-mac-${arch}.${ext}
mac:
  icon: build/icon.icns
  category: public.app-category.education
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
linux:
  icon: build/icons
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: Manuel Sánchez Gomis <me.sanchezgomis@edu.gva.es>
  category: Education
appImage:
  artifactName: AulaNova-${version}-linux-${arch}.${ext}
deb:
  artifactName: aula-nova_${version}_${arch}.${ext}
npmRebuild: false
