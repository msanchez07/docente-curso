name: Publicar release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Empaquetar ${{ matrix.plataforma }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: macOS
            os: macos-latest
            objetivo: mac
            archivos: |
              dist/*.dmg
              dist/*.zip
          - plataforma: Windows
            os: windows-latest
            objetivo: win
            archivos: dist/*.exe
          - plataforma: Linux
            os: ubuntu-latest
            objetivo: linux
            archivos: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Compilar
        shell: bash
        run: npm run build

      - name: Empaquetar
        shell: bash
        run: npx electron-builder --${{ matrix.objetivo }}

      - name: Publicar artefactos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aula Nova ${{ github.ref_name }}
          body_path: RELEASE-1.0.md
          files: ${{ matrix.archivos }}
          fail_on_unmatched_files: true
          generate_release_notes: true
